services:
  - type: web
    name: sigils-relay
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build:server
    startCommand: node apps/server/dist/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ALLOWED_ORIGINS
        value: https://xiaofuwill.github.io
