name: Deploy SIGILS Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 如需在构建时固化 relay 地址，取消下面 env 注释（仓库 Settings → Secrets and variables → Actions → Variables 里建 VITE_SIGILS_WS_URL）
      - run: npm run build:web
        # env:
        #   VITE_SIGILS_WS_URL: ${{ vars.VITE_SIGILS_WS_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
